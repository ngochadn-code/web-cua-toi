<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý lời nhắn 📋</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      min-height: 100vh;
      padding: 20px;
    }
    .hop-chinh {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #2563eb;
      text-align: center;
      margin-bottom: 20px;
    }
    .thong-ke {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .so {
      text-align: center;
      padding: 10px 20px;
      background: #f0f9ff;
      border-radius: 10px;
    }
    .so-lon {
      font-size: 24px;
      font-weight: bold;
      color: #2563eb;
    }
    .loinhan {
      padding: 18px;
      margin: 12px 0;
      border-radius: 10px;
      border-left: 4px solid;
      transition: all 0.2s;
    }
    .loinhan:hover {
      transform: translateX(5px);
    }
    .chua-doc {
      border-color: #ef4444;
      background: #fef2f2;
    }
    .da-doc {
      border-color: #22c55e;
      background: #f0fdf4;
      opacity: 0.7;
    }
    .thong-tin {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .noi-dung {
      line-height: 1.6;
      color: #333;
    }
    .nut {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }
    .nut-xanh { background: #22c55e; color: white; }
    .nut-do { background: #ef4444; color: white; }
    .nut-xam { background: #e5e7eb; color: #666; cursor: default; }
    .cuoi-trang {
      text-align: center;
      margin-top: 30px;
    }
    .lien-ket {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="hop-chinh">
    <h1>📋 Quản lý lời nhắn</h1>

    <div class="thong-ke">
      <div class="so">
        <div class="so-lon" id="tong">0</div>
        <div>Tổng số</div>
      </div>
      <div class="so">
        <div class="so-lon" style="color:#ef4444" id="chuaDoc">0</div>
        <div>Chưa đọc</div>
      </div>
      <div class="so">
        <div class="so-lon" style="color:#22c55e" id="daDoc">0</div>
        <div>Đã đọc</div>
      </div>
    </div>

    <div id="danhSach">
      <p style="text-align:center;color:#888;padding:30px;">Đang tải dữ liệu...</p>
    </div>

    <div class="cuoi-trang">
      <a href="/" class="lien-ket">← Về trang chủ</a>
    </div>
  </div>

    <script>
    const thamSo = new URLSearchParams(window.location.search);
    const matKhau = thamSo.get("mk");

    if (!matKhau) {
      document.getElementById("danhSach").innerHTML = `
        <p style="text-align:center;color:#ef4444;padding:30px;">
          🔒 Thiếu mật khẩu! Vào link: <code>?mk=123456</code>
        </p>
      `;
    } else {
      // Gọi API lấy dữ liệu
      fetch(`/api/danhsach?mk=${matKhau}`)
        .then(phanHoi => phanHoi.json())
        .then(duLieu => {
          if (duLieu.loi) {
            document.getElementById("danhSach").innerHTML = "<p>❌ Không có quyền xem</p>";
            return;
          }

          // Cập nhật số liệu thống kê
          document.getElementById("tong").textContent = duLieu.tong;
          document.getElementById("chuaDoc").textContent = duLieu.chuaDoc;
          document.getElementById("daDoc").textContent = duLieu.daDoc;

          // Hiển thị danh sách
          const vungDanhSach = document.getElementById("danhSach");
          
          if (duLieu.tong === 0) {
            vungDanhSach.innerHTML = `<p style="text-align:center;color:#888;">Chưa có lời nhắn nào 📭</p>`;
            return;
          }

          vungDanhSach.innerHTML = duLieu.duLieu.map(item => `
            <div class="loinhan ${item.daDoc ? "da-doc" : "chua-doc"}">
              <div class="thong-tin">
                <span>
                  <strong>${item.ten}</strong> • ${item.email} • ${item.ngayGui}
                </span>
                ${!item.daDoc ? `
                  <button class="nut nut-xanh" onclick="danhDauDaDoc('${item.id}')">
                    ✅ Đánh dấu đã đọc
                  </button>
                ` : `
                  <span class="nut nut-xam">✓ Đã đọc</span>
                `}
              </div>
              <div class="noi-dung">${item.noiDung}</div>
            </div>
          `).join("");
        })
        .catch(loi => {
          document.getElementById("danhSach").innerHTML = `<p>❌ Lỗi tải dữ liệu</p>`;
        });
    }

    // Hàm đánh dấu đã đọc
    function danhDauDaDoc(id) {
      const thamSo = new URLSearchParams(window.location.search);
      const matKhau = thamSo.get("mk");
      
      fetch(`/danhsach/da-doc?mk=${matKhau}&id=${id}`)
        .then(() => location.reload()); // Tải lại trang
    }
  </script>
</body>
</html>
